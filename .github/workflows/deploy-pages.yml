name: Deploy Nightfall GitHub Pages

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  deploy:
    name: Build & Deploy Nightfall Landing + Web Console to GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Nightfall repository
        uses: actions/checkout@v4

      - name: Setup pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Go toolchain for vendored Nightfall Scorecard
        uses: actions/setup-go@v5
        with:
          go-version-file: 'vendor/scorecard/go.mod'
          cache-dependency-path: 'vendor/scorecard/go.sum'

      - name: Install workspace dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --no-frozen-lockfile

      - name: Build vendored Nightfall Scorecard Go engine
        run: pnpm build:scorecard

      - name: Build vendored codenav C++20 semantic indexer
        run: pnpm build:codenav

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Nightfall GitHub Pages showcase & verified orchestrator capture
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm run build:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/nightfall-ui/dist-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
