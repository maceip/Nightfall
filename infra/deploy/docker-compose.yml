# Nightfall Full-Stack & Microsoft LiteBox Isolated Sandbox Topology
services:
  api-gateway:
    build:
      context: ../..
      dockerfile: infra/litebox/Dockerfile.litebox
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - nightfall_data:/sandbox/.local/share/nightfall
    environment:
      - NIGHTFALL_LITEBOX_BIN_DIR=/opt/nightfall/litebox/bin
      - NIGHTFALL_SQLITE_PATH=/sandbox/.local/share/nightfall/nightfall.sqlite
    command: ["npx", "tsx", "services/api-gateway/src/server.ts"]
    ports:
      - "4000:4000"
    networks:
      - control_plane_net
      - isolated_sandbox_net

  nightfall-ui:
    build:
      context: ../..
      dockerfile: infra/litebox/Dockerfile.litebox
    working_dir: /workspace/apps/nightfall-ui
    volumes:
      - ../..:/workspace
    environment:
      - NIGHTFALL_API_TARGET=http://api-gateway:4000
    command: ["npx", "vite", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    networks:
      - control_plane_net

  # Zero-egress Microsoft LiteBox runner pool (internal: true blocks all direct internet egress;
  # outbound requests must traverse the Nightfall L7 HTTP + WebSocket Egress Policy Proxy).
  litebox-sandbox-runner:
    build:
      context: ../..
      dockerfile: infra/litebox/Dockerfile.litebox
    read_only: true
    tmpfs:
      - /tmp:size=128m,nosuid
      - /sandbox:size=256m,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - isolated_sandbox_net

volumes:
  nightfall_data:

networks:
  control_plane_net:
    driver: bridge
  isolated_sandbox_net:
    driver: bridge
    internal: true
